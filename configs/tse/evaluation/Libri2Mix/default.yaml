metrics:
  - system

dataset: Libri2Mix
paths:
  root: Libri2Mix
  manifest: null
  raw_dataset_name: Libri2Mix
split: test

sample_rate: 16000
max_items: null
overwrite: false
save_audio_outputs: false
save_audio_num_samples: 20
save_audio_seed: 2024
whisper_model: large-v3-turbo
dnsmos_num_threads: 1

compressor:
  sources:
    - s1
    - s2

extractor:
  checkpoint_path: null
  num_infer_steps: 200
  num_candidates: 4
  eta: 0.0
  seed: 2024
  decode_std: mixture
  rerank:
    enabled: true
    provider: ecapa
    source: yangwang825/ecapa-tdnn-vox2

corrector:
  checkpoint_path: null
  reverse_starting_point: 0.5
  num_steps: 1
